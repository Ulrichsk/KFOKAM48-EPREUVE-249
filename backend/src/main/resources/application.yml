spring:
  application:
    name: kfokam48

  # ---------------------------------------------------------------------
  # H2 en developpement (base de demonstration, Q1/Q16) : fichier persistant
  # ./data/kfokam48, en mode PostgreSQL pour que les migrations Flyway servies
  # ici soient exactement celles des tests. Aucun SGBD a installer : le projet
  # demarre sur un poste vierge. Pour brancher un vrai PostgreSQL, surcharger
  # KFOKAM48_DB_URL / KFOKAM48_DB_USER / KFOKAM48_DB_PASSWORD (aucun secret
  # commite : voir la section « Secrets » du .gitignore et le README).
  # ---------------------------------------------------------------------
  datasource:
    url: ${KFOKAM48_DB_URL:jdbc:h2:file:./data/kfokam48;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
    username: ${KFOKAM48_DB_USER:sa}
    password: ${KFOKAM48_DB_PASSWORD:}

  jpa:
    # Le schema appartient a Flyway : validate uniquement, jamais update (ENF5).
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # Convention du projet : tous les horodatages sont stockes en UTC (ENF6).
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080
