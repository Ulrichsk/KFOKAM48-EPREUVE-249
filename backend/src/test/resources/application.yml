# Profil de test : base H2 en memoire, donc aucun PostgreSQL requis sur le
# poste qui execute les tests (ENF9). Flyway reste actif : les tests valident
# les vraies migrations, ce qui garantit qu'elles sont portables.
spring:
  datasource:
    url: jdbc:h2:mem:kfokam48;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration
